<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reader Pro - human check</title>
<style>
body { background:#0A1226; color:#9FB6CC; font-family:sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; margin:0; }
p { font-size:14px; margin:0 0 14px 0; }
</style>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=__tsReady" async defer></script>
<script>
var __wid = null;
function __tsReady() {
  __wid = turnstile.render('#ts', {
    sitekey: '0x4AAAAAAF2Y1RQE0rTaZ8Kk',
    theme: 'dark',
    callback: function(token) {
      if (window.ReaderBridge) { ReaderBridge.onToken(token); }
      else { location.replace('readerpro://captcha#t=' + encodeURIComponent(token)); }
    },
    'error-callback': function() { if (window.ReaderBridge) ReaderBridge.onError(); },
    'expired-callback': function() { if (window.ReaderBridge) ReaderBridge.onExpired(); }
  });
}
function __reset() {
  if (__wid !== null) { try { turnstile.reset(__wid); } catch (e) { location.reload(); } }
  else { location.reload(); }
}
</script>
</head>
<body>
<p>One quick check that you are human</p>
<div id="ts"></div>
</body>
</html>
<!-- pages rebuild -->
